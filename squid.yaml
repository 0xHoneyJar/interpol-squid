manifestVersion: subsquid.io/v0.1
name: interpol-mainnet-v2
version: 2
description: "Interpol Mainnet v2 Squid"
build:
deploy:
  env:
    PORTAL_URL: ${{ addons.portal.berachain_bartio.http }}
  addons:
    postgres:
    # rpc:
    #   - eth.http
  processor:
    cmd: ["sqd", "process:prod"]
  api:
    cmd: ["sqd", "serve:prod"]
scale:
  dedicated: true
  addons:
    postgres:
      storage: 50G
